[package]
name = "csboard-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
parser = { path = "../.local/native-demoparser/src/parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha2 = "0.10"
rayon = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
