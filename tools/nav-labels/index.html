<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NAV 地名标注</title><link rel="stylesheet" href="./style.css"></head><body>
<header><b>NAV 地名标注</b><select id="map"></select><select id="floor"><option value="all">全部楼层</option><option value="main">上层 / 主层</option><option value="lower">下层</option></select><label>Z <input id="min-z" type="number" placeholder="最低"><input id="max-z" type="number" placeholder="最高"></label><button id="fit">适应地图</button><button id="top">俯视</button><button id="undo">撤销</button><button id="redo">重做</button></header>
<main><aside><button id="add">＋ 地名区域</button><div class="modes"><button id="spawn-t">＋ T 出生区</button><button id="spawn-ct">＋ CT 出生区</button></div><div id="regions"></div><label>名称<input id="name" maxlength="80" placeholder="例如：B 洞"></label><label>别名<input id="aliases" placeholder="例如：B Tunnels, B通"></label><label id="region-team-label" hidden>区域阵营<select id="region-team"><option>T</option><option>CT</option></select></label><label>笔刷 <input id="brush" type="range" min="4" max="80" value="24"></label><div class="modes"><button id="paint" class="active">涂画</button><button id="erase">擦除</button></div><button id="remove">删除当前区域</button><hr><h3>具体出生点</h3>
<label>阵营<select id="point-team"><option>T</option><option>CT</option></select></label>
<button id="add-point">＋ 点击地面添加出生点</button><div id="points"></div>
<label>名称<input id="point-name" maxlength="80"></label><label>朝向（Source 度）<input id="point-yaw" type="number" step="1" value="0"></label>
<label>所属出生区域<select id="point-region"><option value="">未关联</option></select></label>
<p id="point-position"></p><div class="modes"><button id="move-point">重新定位</button><button id="focus-point">聚焦</button></div><button id="remove-point">删除出生点</button>
<p id="mode-status" role="status">区域涂画模式</p><p>左键涂画；右键旋转，中键平移，滚轮缩放。Shift 临时擦除。只涂鼠标可见的地面，不穿透上下层；需要时用楼层或 Z 范围隐藏遮挡。</p><p>涂画的是完整 NAV 单元，不是图片像素；将区域改名或填写别名即可。</p><button id="save">保存到项目</button><button id="export">导出 JSON</button><button id="import">导入 JSON</button><input id="file" type="file" accept="application/json,.json" hidden><p id="status" role="status"></p></aside><div id="viewport"><canvas id="canvas"></canvas><div id="labels"></div><div id="hover"></div></div></main>
<script type="module" src="./editor.js"></script></body></html>
