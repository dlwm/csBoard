name: csboard

services:
  csboard:
    build:
      context: ../..
      dockerfile: config/docker/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-v1.18.0}
        CSBOARD_AI_ENABLED: ${CSBOARD_AI_ENABLED:-true}

    container_name: csboard
    restart: unless-stopped

    ports:
      - "${PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      LOCAL_MAPS_DIR: /app/.local/official/maps
      AI_ALLOWED_BASE_URLS: ${AI_ALLOWED_BASE_URLS:-}
      AI_ALLOWED_WEB_ORIGINS: ${AI_ALLOWED_WEB_ORIGINS:-}

    volumes:
      - type: bind
        source: ../../.local/official/maps
        target: /app/.local/official/maps
        read_only: true
