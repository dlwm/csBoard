name: Android development build

on:
  push:
    branches: [feature/mobile]
    paths:
      - 'src/**'
      - 'native/**'
      - 'config/build/**'
      - 'scripts/**'
      - 'package*.json'
      - 'index.html'
      - 'capacitor.config.json'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:
    inputs:
      parser:
        description: Demo parser engine
        type: choice
        options: [native, wasm]
        default: native

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}-${{ inputs.parser || 'native' }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CSBOARD_PARSER_ENGINE: ${{ inputs.parser || 'native' }}
      CSBOARD_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/mobile/go.mod
          cache-dependency-path: |
            native/mobile/go.sum
            native/parser/go.sum
            native/storage/go.sum
      - run: npm ci
      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build development APK
        run: npm run mobile -- build android
      - uses: actions/upload-artifact@v4
        with:
          name: csboard-android-development-${{ inputs.parser || 'native' }}
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
