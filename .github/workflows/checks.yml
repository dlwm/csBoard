name: Checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/parser/go.mod
          cache-dependency-path: |
            native/parser/go.sum
            native/storage/go.sum
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Prepare native test prerequisites
        run: |
          npm ci
          npm run native:build
      - name: Run behavioral and native storage tests
        run: node --test tests/*.test.js
      - name: Run Go storage tests
        working-directory: native/storage
        run: go test ./...
      - name: Build web frontend
        run: npm run build
      - name: Run Go parser adapter tests
        working-directory: native/parser
        run: go test ./...
      - name: Validate Workers with their real bundler (no deployment)
        run: make workers-build
