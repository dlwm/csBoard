name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.20.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/parser/go.mod
          cache-dependency-path: |
            native/parser/go.sum
            native/storage/go.sum
      - id: release
        name: Validate tag, versions and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-metadata.js
      - name: Check release behavior before packaging
        run: |
          make install
          make release-check

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            arch: arm64
            native: darwin-arm64
            command: desktop-build-mac-arm64
            extension: dmg
          - target: win-x64
            runner: windows-2022
            arch: x64
            native: win32-x64
            command: desktop-build-win-x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # mac.identity='-' explicitly signs ad-hoc without paid credentials.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSBOARD_NATIVE_TARGET: ${{ matrix.native }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/parser/go.mod
          cache-dependency-path: |
            native/parser/go.sum
            native/storage/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Prepare dependencies
        run: |
          make install
      - name: Build native component and run behavioral tests
        run: |
          make test
      - name: Build installer
        run: make ${{ matrix.command }}
      - name: Inspect package signatures, files and packaged storage
        run: node scripts/check-desktop-package.js ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.target }}
          path: build/desktop/CSBoard-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  mobile:
    needs: prepare
    uses: ./.github/workflows/mobile-build.yml
    with:
      build_ref: ${{ needs.prepare.outputs.commit }}
      platform: android
      parser: native

  draft:
    needs: [prepare, desktop, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-upload-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: build/release
      - name: Upload desktop and mobile packages to a draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_ASSET_KIND: all
        run: node scripts/publish-release.js
