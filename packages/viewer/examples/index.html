<!doctype html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSBoard Viewer · independent example</title>
<style>body{margin:0;background:#101619;color:#e4ebea;font:15px system-ui}header{padding:14px 20px}button{padding:8px 12px;margin:4px;border:1px solid #465352;background:#24312e;color:inherit;border-radius:6px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.view{height:65vh;min-height:300px;position:relative}.view canvas{display:block;width:100%;height:100%;touch-action:none}pre{padding:12px;max-height:160px;overflow:auto;font-size:12px}h1{font-size:20px;margin:0 0 10px}@media(max-width:800px){main{grid-template-columns:1fr}.view{height:45vh}}</style></head>
<body><header><h1>独立视图库示例</h1><span>两个独立实例；拖动旋转、滚轮缩放、点击人物拾取。</span><div><button id="rename">主视图人物改名</button><button id="mode">主视图 2D / 3D</button><button id="copy-frame" disabled>复制当前帧到编辑</button><button id="dispose">销毁右侧实例</button><label>打开回放包 <input id="replay-file" type="file" accept=".cs2df,.zip"></label><span id="replay-status"></span></div><div id="replay-controls" hidden><select id="segment"></select><button id="play">播放 / 暂停</button><input id="seek" type="range" step="1"><span id="time"></span><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div><div><select id="pov-player"></select><button id="pov">跟随第一人称</button><button id="free">恢复自由相机</button><button id="monitors">四人监视器 / 关闭</button></div><div><label>地图 GLB <input id="model-file" type="file" accept=".glb"></label><button id="model-toggle">显示 / 隐藏模型</button><button id="model-unload">卸载模型</button><span id="model-status"></span></div><div><label>模型透明度 <input id="model-opacity" type="range" min="0" max="1" step="0.05" value="1"></label><select id="model-focus"><option value="full">完整模型</option><option value="pointer">鼠标透视</option><option value="camera">相机透视</option></select><label>右视图楼层 <select id="floor"></select></label></div><details><summary>模型对象树</summary><input id="objects-query" placeholder="按对象名称筛选"><div id="objects-tree"></div></details></header>
<main><section><div id="first" class="view"></div></section><section><div id="second" class="view"></div></section></main><section id="hud-roster"></section><p id="hud-kills"></p><pre id="events"></pre><script type="module" src="./main.js"></script></body></html>
